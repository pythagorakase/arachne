<!doctype html>
<html lang="en" data-issue="@@ARACHNE_ISSUE@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>@@ARACHNE_DOCUMENT_TITLE@@</title>
<style>
  :root {
    color-scheme: dark;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #090b10;
    color: #f5eee7;
    --muted: #b9b0a8;
    --panel: #121720;
    --line: #37404e;
    --accent: #e6a45e;
    --neutral: #79b8c9;
    --yes: #61c89a;
    --kind: #d9aa58;
    --no: #dd7777;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0 auto;
    max-width: 1040px;
    padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
      max(35vh, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: radial-gradient(circle at 20% -10%, #27202e 0, transparent 32rem), #090b10;
  }
  button, textarea, input { font: inherit; }
  button { touch-action: manipulation; }
  .brief-header { padding: clamp(22px, 6vw, 48px) 2px 24px; }
  .eyebrow, .kicker {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: .74rem;
    font-weight: 800;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  h1 {
    max-width: 17ch;
    margin: 0 0 14px;
    font-size: clamp(2.3rem, 8vw, 4.7rem);
    line-height: .96;
    letter-spacing: -.05em;
  }
  .question-summary {
    max-width: 65ch;
    margin: 0 0 9px;
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    font-weight: 760;
  }
  .instructions {
    max-width: 65ch;
    margin: 0;
    color: var(--muted);
    font-size: clamp(1rem, 3vw, 1.16rem);
    line-height: 1.5;
  }
  .progress-shell {
    position: sticky;
    z-index: 10;
    top: max(8px, env(safe-area-inset-top));
    display: grid;
    grid-template-columns: auto minmax(100px, 1fr);
    gap: 14px;
    align-items: center;
    margin-bottom: 18px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgb(14 17 24 / 94%);
    box-shadow: 0 12px 34px rgb(0 0 0 / 32%);
    color: var(--muted);
    font-size: .82rem;
    font-weight: 750;
    backdrop-filter: blur(14px);
  }
  progress {
    width: 100%;
    height: 8px;
    overflow: hidden;
    border: 0;
    border-radius: 999px;
    background: #28313d;
  }
  progress::-webkit-progress-bar { background: #28313d; }
  progress::-webkit-progress-value { background: var(--accent); }
  progress::-moz-progress-bar { background: var(--accent); }
  .review-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 92px;
    gap: 16px;
    align-items: start;
  }
  main { min-width: 0; }
  .rating-card {
    min-height: 76vh;
    padding: clamp(15px, 4vw, 28px);
    border: 1px solid var(--line);
    border-radius: 22px;
    background: rgb(18 23 32 / 96%);
    box-shadow: 0 26px 70px rgb(0 0 0 / 28%);
    scroll-margin-top: 72px;
  }
  .rating-card[hidden] { display: none; }
  .rating-card header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    margin-bottom: 15px;
  }
  .rating-card header .kicker { grid-column: 1 / -1; }
  .rating-card h2 {
    margin: 0;
    font-size: clamp(1.7rem, 6vw, 2.7rem);
    letter-spacing: -.035em;
  }
  .rating-card header span {
    margin-bottom: 4px;
    color: var(--muted);
    font-weight: 700;
  }
  .rating-card figure {
    display: grid;
    width: min(100%, 620px);
    margin: 0 auto 22px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #040507;
  }
  .rating-card figure img {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
  }
  .rating-card fieldset {
    display: grid;
    gap: 10px;
    margin: 0 0 18px;
    padding: 0;
    border: 0;
  }
  .rating-card legend {
    margin-bottom: 12px;
    font-size: 1.12rem;
    font-weight: 780;
  }
  .rating { display: block; cursor: pointer; }
  .rating input {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
  }
  .rating span {
    display: grid;
    grid-template-columns: minmax(6.5rem, auto) 1fr;
    gap: 10px;
    align-items: center;
    min-height: 62px;
    padding: 12px 16px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: #0c1016;
  }
  .rating small { color: var(--muted); }
  .rating input:checked + span {
    border-color: var(--rating-color);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--rating-color) 20%, transparent);
  }
  .rating input:focus-visible + span {
    outline: 3px solid var(--neutral);
    outline-offset: 2px;
  }
  .comment-label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: .82rem;
    font-weight: 760;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  textarea {
    display: block;
    width: 100%;
    resize: vertical;
    margin-bottom: 18px;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #080b10;
    color: #f5eee7;
  }
  textarea:focus { border-color: var(--neutral); outline: 0; }
  .rating-card nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
  .rating-card button {
    min-height: 54px;
    padding: 11px 15px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-weight: 790;
  }
  .secondary { background: #151a23; color: #eee7df; }
  .primary { border-color: #bd7d43; background: #b56d33; color: #fff; }
  button:disabled { opacity: .38; }
  .done {
    padding: 13px 15px;
    border: 1px solid #4a8c71;
    border-radius: 12px;
    background: rgb(58 113 89 / 16%);
    color: #bfe7d3;
  }
  .history {
    position: sticky;
    top: 76px;
    display: grid;
    gap: 9px;
    max-height: calc(100vh - 92px);
    overflow: auto;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgb(12 16 22 / 94%);
  }
  .history h2 {
    margin: 0 0 2px;
    color: var(--muted);
    font-size: .68rem;
    letter-spacing: .09em;
    text-align: center;
    text-transform: uppercase;
  }
  .history button {
    position: relative;
    display: block;
    width: 70px;
    height: 70px;
    padding: 0;
    overflow: hidden;
    border: 2px solid var(--line);
    border-radius: 11px;
    background: #050608;
  }
  .history button[data-rating] { border-color: var(--rating-color, var(--neutral)); }
  .history img { width: 100%; height: 100%; object-fit: cover; }
  .history b {
    position: absolute;
    right: 3px;
    bottom: 3px;
    padding: 2px 5px;
    border-radius: 999px;
    background: rgb(0 0 0 / 75%);
    font-size: .62rem;
  }
  .history button.is-active { box-shadow: 0 0 0 2px var(--accent); }
  .history button.is-unrated { opacity: .45; }
  .history button.is-unrated.is-active { opacity: 1; }
  .history button.is-unrated img { visibility: hidden; }
  @media (max-width: 700px) {
    .review-layout { display: flex; flex-direction: column; }
    .history {
      position: sticky;
      z-index: 9;
      top: 70px;
      order: -1;
      display: flex;
      width: 100%;
      max-height: none;
      overflow-x: auto;
    }
    .history h2 { display: none; }
    .history button { flex: 0 0 54px; width: 54px; height: 54px; }
    .rating-card { border-radius: 17px; }
    .rating span { grid-template-columns: minmax(5.2rem, auto) 1fr; padding-inline: 13px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<header class="brief-header">
  <p class="eyebrow">Blinded rating · @@ARACHNE_SUBJECT@@</p>
  <h1>@@ARACHNE_HEADING@@</h1>
  <p class="question-summary">@@ARACHNE_QUESTION@@</p>
  <p class="instructions">@@ARACHNE_INSTRUCTIONS@@</p>
</header>
<div class="progress-shell" aria-live="polite">
  <span data-progress-copy>0 rated</span>
  <progress data-progress max="1" value="0">0 rated</progress>
</div>
<form>
  <input type="hidden" name="review__cursor" value="0" data-review-cursor>
  <div class="review-layout">
    <main>
@@ARACHNE_SECTIONS@@
    </main>
    <aside class="history" aria-label="Rating set">
      <h2>Set</h2>
      <div data-history></div>
    </aside>
  </div>
</form>

<script id="arachne-review-assets" type="application/json">@@ARACHNE_ASSETS_JSON@@</script>
<script id="arachne-review-model" type="application/json">@@ARACHNE_REVIEW_JSON@@</script>
<script data-arachne-image-rating>
(() => {
  "use strict";

  const assets = JSON.parse(document.getElementById("arachne-review-assets").textContent);
  const review = JSON.parse(document.getElementById("arachne-review-model").textContent);
  const sections = Array.from(document.querySelectorAll("[data-decision]"));
  const cursor = document.querySelector("[data-review-cursor]");
  const progress = document.querySelector("[data-progress]");
  const progressCopy = document.querySelector("[data-progress-copy]");
  const history = document.querySelector("[data-history]");
  const palette = ["var(--yes)", "var(--kind)", "var(--no)"];
  let activeIndex = 0;

  for (const image of document.querySelectorAll("img[data-review-image]")) {
    const source = assets[image.dataset.reviewImage];
    if (source) image.src = source;
  }

  const ratingInput = (section) =>
    section.querySelector('input[type="radio"]:checked');
  const answered = (section) => Boolean(ratingInput(section));

  const historyButtons = sections.map((section, index) => {
    const button = document.createElement("button");
    button.type = "button";
    const label = section.dataset.label || `Item ${String(index + 1).padStart(2, "0")}`;
    button.title = label;
    button.addEventListener("click", () => showItem(index));
    const image = section.querySelector("[data-review-image]").cloneNode();
    image.removeAttribute("data-review-image");
    image.alt = "";
    image.setAttribute("aria-hidden", "true");
    const number = document.createElement("b");
    number.textContent = (label.replace(/\D/g, "") || String(index + 1)).padStart(2, "0");
    button.append(image, number);
    history.append(button);
    return button;
  });

  function updateHistory() {
    sections.forEach((section, index) => {
      const button = historyButtons[index];
      const rating = ratingInput(section);
      if (rating) {
        button.dataset.rating = rating.value;
        const optionIndex = review.options.findIndex((option) => option.value === rating.value);
        button.style.setProperty("--rating-color", palette[optionIndex] || "var(--neutral)");
      } else {
        delete button.dataset.rating;
        button.style.removeProperty("--rating-color");
      }
      const active = index === activeIndex;
      button.classList.toggle("is-active", active);
      button.classList.toggle("is-unrated", !rating);
      button.disabled = !rating && !active;
      if (active) button.setAttribute("aria-current", "true");
      else button.removeAttribute("aria-current");
    });
  }

  function update() {
    const count = sections.filter(answered).length;
    progress.max = sections.length;
    progress.value = count;
    progress.textContent = `${count} of ${sections.length} rated`;
    progressCopy.textContent = `${count} of ${sections.length} rated`;
    sections.forEach((section, index) => {
      section.querySelector("[data-review-previous]").disabled = index === 0;
      const next = section.querySelector("[data-review-next]");
      const note = section.querySelector("[data-complete-note]");
      if (index === sections.length - 1) {
        next.hidden = true;
        note.hidden = !answered(section);
      } else {
        next.hidden = false;
        next.disabled = !answered(section);
        note.hidden = true;
      }
    });
    updateHistory();
  }

  function showItem(index, {scroll = true} = {}) {
    activeIndex = Math.max(0, Math.min(sections.length - 1, Number(index) || 0));
    sections.forEach((section, position) => {
      section.hidden = position !== activeIndex;
    });
    cursor.value = String(activeIndex);
    update();
    if (scroll) sections[activeIndex].scrollIntoView({behavior: "smooth", block: "start"});
  }

  sections.forEach((section, index) => {
    section.querySelector("[data-review-previous]").addEventListener("click", () => {
      showItem(index - 1);
    });
    section.querySelector("[data-review-next]").addEventListener("click", () => {
      if (answered(section)) showItem(index + 1);
    });
  });
  document.addEventListener("input", update);
  document.addEventListener("change", update);

  function syncFromInputs() {
    showItem(Number(cursor.value || 0), {scroll: false});
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent || event.data?.source !== "arachne-chrome") return;
    if (event.data.type === "restore") setTimeout(syncFromInputs, 0);
    if (event.data.type === "scroll-to") {
      const index = sections.findIndex(
        (section) => section.dataset.decision === event.data.axis,
      );
      if (index >= 0) showItem(index);
    }
  });

  window.arachneCaptureHooks = Object.freeze({
    isAnswered: answered,
    composeMarkdown(form) {
      const labels = Object.fromEntries(
        review.options.map((option) => [option.value, option.label]),
      );
      const tally = Object.fromEntries(review.options.map((option) => [option.value, 0]));
      const lines = [`# ${review.title}`, ""];
      for (const face of review.faces) {
        const rating = String(form[face.ratingField] || "");
        if (Object.hasOwn(tally, rating)) tally[rating] += 1;
        lines.push(`## ${face.label}`, `- Rating: ${labels[rating] || "unanswered"}`);
        const comment = String(form[face.commentField] || "").trim();
        if (comment) {
          lines.push("", "Comment:", ...comment.split(/\r?\n/).map((line) => `> ${line}`));
        }
        lines.push("");
      }
      lines.push("## Tally");
      for (const option of review.options) {
        lines.push(`- ${option.label}: ${tally[option.value]}`);
      }
      return lines.join("\n").trim();
    },
  });

  showItem(0, {scroll: false});
})();
</script>
<script data-arachne-brief-agent>
@@ARACHNE_BRIEF_AGENT@@
</script>
</body>
</html>
