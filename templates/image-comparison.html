<!doctype html>
<html lang="en" data-issue="@@ARACHNE_ISSUE@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>@@ARACHNE_DOCUMENT_TITLE@@</title>
<style>
  :root {
    color-scheme: dark;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #090b10;
    color: #f4eee7;
    --ink-muted: #b8b0a8;
    --panel: #11151d;
    --panel-raised: #171c26;
    --line: #313947;
    --accent: #e9a75f;
    --accent-cool: #79b8c9;
    --selected: #f3c58f;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0 auto;
    max-width: 1240px;
    padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
      max(34vh, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    background:
      radial-gradient(circle at 18% -8%, #262130 0, transparent 34rem),
      #090b10;
  }
  body.lightbox-open { overflow: hidden; }
  button, textarea { font: inherit; }
  button { touch-action: manipulation; }
  h1, h2, p { margin-top: 0; }
  .brief-header {
    padding: clamp(20px, 5vw, 52px) 2px clamp(20px, 4vw, 38px);
  }
  .eyebrow {
    margin-bottom: 8px;
    color: var(--accent);
    font-size: .75rem;
    font-weight: 760;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  h1 {
    max-width: 18ch;
    margin-bottom: 14px;
    font-size: clamp(2rem, 7vw, 4.7rem);
    line-height: .98;
    letter-spacing: -.045em;
  }
  .instructions {
    max-width: 70ch;
    margin-bottom: 0;
    color: var(--ink-muted);
    font-size: clamp(1rem, 2.1vw, 1.2rem);
    line-height: 1.55;
  }
  .review-progress {
    position: sticky;
    z-index: 8;
    top: max(8px, env(safe-area-inset-top));
    display: grid;
    grid-template-columns: auto minmax(100px, 1fr);
    gap: 14px;
    align-items: center;
    margin: 0 0 18px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgb(14 17 24 / 92%);
    box-shadow: 0 12px 36px rgb(0 0 0 / 30%);
    color: var(--ink-muted);
    font-size: .83rem;
    font-weight: 720;
    backdrop-filter: blur(14px);
  }
  progress {
    width: 100%;
    height: 8px;
    overflow: hidden;
    border: 0;
    border-radius: 999px;
    background: #262d39;
  }
  progress::-webkit-progress-bar { background: #262d39; }
  progress::-webkit-progress-value { background: var(--accent); }
  progress::-moz-progress-bar { background: var(--accent); }
  .pose {
    min-height: 82vh;
    margin: 0 0 34px;
    padding: clamp(15px, 3vw, 30px);
    border: 1px solid var(--line);
    border-radius: 20px;
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    box-shadow: 0 26px 70px rgb(0 0 0 / 24%);
    scroll-margin-top: 74px;
  }
  .pose[hidden] { display: none; }
  .pose-header { margin-bottom: 18px; }
  h2 {
    margin-bottom: 8px;
    font-size: clamp(1.55rem, 4vw, 2.6rem);
    letter-spacing: -.025em;
  }
  .pose-note, .ranking-help {
    max-width: 70ch;
    color: var(--ink-muted);
    line-height: 1.45;
  }
  .pair-decision, .ranking-decision {
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .pair-decision > legend, .ranking-decision > legend {
    width: 100%;
    margin-bottom: 10px;
    color: var(--ink-muted);
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .pair {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(8px, 2vw, 18px);
  }
  .option-shell, .ranking-item {
    position: relative;
    min-width: 0;
    border-radius: 16px;
    background: var(--panel-raised);
  }
  .option-card, .rank-card {
    position: relative;
    display: grid;
    min-width: 0;
    overflow: hidden;
    border: 2px solid var(--line);
    border-radius: 16px;
    background: #0d1016;
  }
  .option-card {
    cursor: pointer;
    transition: border-color 120ms ease, box-shadow 120ms ease, transform 120ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .option-card:active { transform: scale(.995); }
  .option-card:has(.choice-input:checked) {
    border-color: var(--selected);
    box-shadow: 0 0 0 3px rgb(243 197 143 / 20%);
  }
  .choice-input {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
  }
  .choice-input:focus-visible + .option-letter {
    outline: 3px solid var(--accent-cool);
    outline-offset: 3px;
  }
  .option-letter, .rank-badge {
    position: absolute;
    z-index: 2;
    top: 9px;
    left: 9px;
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    border: 1px solid rgb(255 255 255 / 28%);
    border-radius: 999px;
    background: rgb(5 7 10 / 82%);
    color: white;
    font-size: 1rem;
    font-weight: 850;
    backdrop-filter: blur(8px);
  }
  .image-frame {
    display: grid;
    width: 100%;
    aspect-ratio: 3 / 4;
    place-items: center;
    overflow: hidden;
    background: #050609;
  }
  .image-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .choose-label {
    padding: 14px 12px;
    color: #eee7df;
    font-size: .94rem;
    font-weight: 720;
    text-align: center;
  }
  .option-card:has(.choice-input:checked) .choose-label {
    background: rgb(233 167 95 / 13%);
    color: var(--selected);
  }
  .zoom-button {
    position: absolute;
    z-index: 3;
    top: 9px;
    right: 9px;
    min-height: 34px;
    padding: 0 11px;
    border: 1px solid rgb(255 255 255 / 28%);
    border-radius: 999px;
    background: rgb(5 7 10 / 82%);
    color: white;
    font-size: .72rem;
    font-weight: 720;
    backdrop-filter: blur(8px);
  }
  .tie-choice {
    display: flex;
    width: fit-content;
    min-height: 46px;
    margin: 16px auto 0;
    padding: 0 17px;
    align-items: center;
    gap: 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #0d1016;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .tie-choice:has(input:checked) {
    border-color: var(--selected);
    color: var(--selected);
  }
  .ranking-help { margin-bottom: 14px; }
  .ranking-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 13px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .ranking-item {
    cursor: grab;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .ranking-item.dragging { opacity: .45; }
  .ranking-item.drop-target { transform: translateY(-4px); }
  .rank-controls {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    border-top: 1px solid var(--line);
    color: var(--ink-muted);
    text-align: center;
  }
  .rank-controls button {
    min-height: 44px;
    border: 0;
    background: transparent;
    color: #eee7df;
    font-size: 1.15rem;
  }
  .rank-controls button:disabled { color: #555c68; }
  .rank-controls span { font-size: .8rem; font-weight: 740; }
  .ranking-confirm {
    display: block;
    min-height: 48px;
    margin: 17px auto 0;
    padding: 0 22px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: rgb(233 167 95 / 13%);
    color: var(--selected);
    font-weight: 760;
  }
  .ranking-status {
    margin: 9px 0 0;
    color: var(--ink-muted);
    font-size: .8rem;
    text-align: center;
  }
  .comment-label {
    display: block;
    margin: 24px 0 8px;
    color: var(--ink-muted);
    font-size: .84rem;
    font-weight: 700;
  }
  textarea {
    width: 100%;
    min-height: 86px;
    resize: vertical;
    padding: 13px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: 0;
    background: #090c11;
    color: inherit;
    line-height: 1.45;
  }
  textarea:focus { border-color: var(--accent-cool); }
  .review-navigation {
    display: grid;
    grid-template-columns: minmax(88px, auto) 1fr minmax(88px, auto);
    gap: 10px;
    align-items: center;
    margin-top: 18px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #0d1016;
    box-shadow: 0 12px 32px rgb(0 0 0 / 34%);
  }
  .review-navigation button {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel-raised);
    color: #f4eee7;
    font-weight: 730;
  }
  .review-navigation button[data-review-next] {
    border-color: var(--accent);
    background: rgb(233 167 95 / 13%);
    color: var(--selected);
  }
  .review-navigation button:disabled { opacity: .38; }
  .review-navigation span {
    color: var(--ink-muted);
    font-size: .78rem;
    text-align: center;
  }
  .lightbox[hidden] { display: none; }
  .lightbox {
    position: fixed;
    z-index: 20;
    inset: 0;
    display: grid;
    padding: max(54px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
    place-items: center;
    background: rgb(0 0 0 / 94%);
  }
  .lightbox img {
    display: block;
    width: 100%;
    height: 100%;
    max-height: calc(100vh - 76px);
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    min-width: 44px;
    min-height: 38px;
    border: 1px solid #555;
    border-radius: 999px;
    background: #15171d;
    color: white;
    font-weight: 750;
  }
  @media (max-width: 720px) {
    body {
      padding-left: max(9px, env(safe-area-inset-left));
      padding-right: max(9px, env(safe-area-inset-right));
    }
    .brief-header { padding-left: 5px; padding-right: 5px; }
    .review-progress { grid-template-columns: 1fr; gap: 6px; border-radius: 14px; }
    .pose { min-height: 84vh; padding: 13px; border-radius: 15px; }
    .pair { gap: 7px; }
    .option-shell, .option-card, .rank-card { border-radius: 11px; }
    .option-letter, .rank-badge { top: 6px; left: 6px; width: 30px; height: 30px; }
    .zoom-button { top: 6px; right: 6px; min-height: 30px; padding: 0 8px; font-size: .66rem; }
    .choose-label { padding: 11px 5px; font-size: .82rem; }
    .ranking-list { grid-template-columns: 1fr; }
    .rank-image-frame { max-height: 66vh; }
    .review-navigation { grid-template-columns: 1fr 1fr; }
    .review-navigation span { grid-column: 1 / -1; grid-row: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .option-card, .ranking-item { transition: none; }
  }
</style>
</head>
<body>
<header class="brief-header">
  <p class="eyebrow">Blind reference review · @@ARACHNE_SUBJECT@@</p>
  <h1>@@ARACHNE_HEADING@@</h1>
  <p class="instructions">@@ARACHNE_INSTRUCTIONS@@</p>
</header>
<aside class="review-progress" aria-live="polite">
  <span data-review-progress-copy>0 complete</span>
  <progress data-review-progress value="0" max="1"></progress>
</aside>
<input type="hidden" name="review__cursor" value="0" data-review-cursor>
<main>
@@ARACHNE_SECTIONS@@
</main>

<div class="lightbox" data-review-lightbox hidden role="dialog" aria-modal="true"
  aria-label="Expanded candidate preview">
  <button class="lightbox-close" type="button" data-review-lightbox-close>Close</button>
  <img data-review-lightbox-image alt="Expanded candidate preview">
</div>

<script id="arachne-review-assets" type="application/json">@@ARACHNE_ASSETS_JSON@@</script>
<script id="arachne-review-model" type="application/json">@@ARACHNE_REVIEW_JSON@@</script>
<script data-arachne-image-comparison>
(() => {
  "use strict";

  const assets = JSON.parse(document.getElementById("arachne-review-assets").textContent);
  const review = JSON.parse(document.getElementById("arachne-review-model").textContent);
  const sections = Array.from(document.querySelectorAll("[data-decision]"));
  const cursor = document.querySelector("[data-review-cursor]");
  const progress = document.querySelector("[data-review-progress]");
  const progressCopy = document.querySelector("[data-review-progress-copy]");
  let activeIndex = 0;

  for (const image of document.querySelectorAll("img[data-review-image]")) {
    const source = assets[image.dataset.reviewImage];
    if (source) image.src = source;
  }

  const lightbox = document.querySelector("[data-review-lightbox]");
  const lightboxImage = document.querySelector("[data-review-lightbox-image]");
  let returnFocus = null;
  function closeLightbox() {
    if (lightbox.hidden) return;
    lightbox.hidden = true;
    lightboxImage.removeAttribute("src");
    document.body.classList.remove("lightbox-open");
    returnFocus?.focus();
    returnFocus = null;
  }
  for (const button of document.querySelectorAll("[data-review-zoom]")) {
    button.addEventListener("click", () => {
      const source = assets[button.dataset.reviewZoom];
      if (!source) return;
      returnFocus = button;
      lightboxImage.src = source;
      lightboxImage.alt = button.dataset.reviewZoomAlt || "Expanded candidate preview";
      lightbox.hidden = false;
      document.body.classList.add("lightbox-open");
      document.querySelector("[data-review-lightbox-close]").focus();
    });
  }
  document.querySelector("[data-review-lightbox-close]").addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeLightbox();
  });

  function rankingIds(section) {
    return Array.from(section.querySelectorAll("[data-ranking-candidate]"))
      .map((item) => item.dataset.rankingCandidate || "")
      .filter(Boolean);
  }

  function rankingIsValid(section) {
    const value = section.querySelector("[data-ranking-input]")?.value || "";
    const ids = value.split("|").filter(Boolean);
    return ids.length === 3 && new Set(ids).size === 3;
  }

  function sectionAnswered(section) {
    if (section.dataset.reviewMode === "ranking") return rankingIsValid(section);
    return Boolean(section.querySelector('[data-review-pair] input[type="radio"]:checked'));
  }

  function updateRankDisplay(list) {
    const items = Array.from(list.querySelectorAll("[data-ranking-candidate]"));
    items.forEach((item, index) => {
      item.querySelector("[data-rank-badge]").textContent = String(index + 1);
      item.querySelector("[data-rank-label]").textContent =
        index === 0 ? "Best" : index === items.length - 1 ? "Worst" : "Middle";
      item.querySelector("[data-rank-up]").disabled = index === 0;
      item.querySelector("[data-rank-down]").disabled = index === items.length - 1;
    });
  }

  function commitRanking(section) {
    const input = section.querySelector("[data-ranking-input]");
    input.value = rankingIds(section).join("|");
    section.querySelector("[data-ranking-status]").textContent = "Ranking saved.";
    section.querySelector("[data-ranking-confirm]").textContent = "Ranking saved";
    input.dispatchEvent(new Event("input", {bubbles: true}));
    input.dispatchEvent(new Event("change", {bubbles: true}));
  }

  for (const ranking of document.querySelectorAll("[data-review-ranking]")) {
    const section = ranking.closest("[data-decision]");
    const list = ranking.querySelector("[data-ranking-list]");
    let dragged = null;
    updateRankDisplay(list);

    ranking.querySelector("[data-ranking-confirm]").addEventListener("click", () => {
      commitRanking(section);
    });
    ranking.addEventListener("click", (event) => {
      const button = event.target.closest("[data-rank-up], [data-rank-down]");
      if (!button) return;
      const item = button.closest("[data-ranking-candidate]");
      if (button.hasAttribute("data-rank-up") && item.previousElementSibling) {
        list.insertBefore(item, item.previousElementSibling);
      } else if (button.hasAttribute("data-rank-down") && item.nextElementSibling) {
        list.insertBefore(item.nextElementSibling, item);
      } else {
        return;
      }
      updateRankDisplay(list);
      commitRanking(section);
    });
    list.addEventListener("dragstart", (event) => {
      dragged = event.target.closest("[data-ranking-candidate]");
      if (!dragged) return;
      dragged.classList.add("dragging");
      if (event.dataTransfer) event.dataTransfer.effectAllowed = "move";
    });
    list.addEventListener("dragover", (event) => {
      const target = event.target.closest("[data-ranking-candidate]");
      if (!dragged || !target || target === dragged) return;
      event.preventDefault();
      for (const item of list.children) item.classList.toggle("drop-target", item === target);
    });
    list.addEventListener("drop", (event) => {
      const target = event.target.closest("[data-ranking-candidate]");
      if (!dragged || !target || target === dragged) return;
      event.preventDefault();
      const rect = target.getBoundingClientRect();
      const after = window.matchMedia("(max-width: 720px)").matches
        ? event.clientY > rect.top + rect.height / 2
        : event.clientX > rect.left + rect.width / 2;
      list.insertBefore(dragged, after ? target.nextElementSibling : target);
      updateRankDisplay(list);
      commitRanking(section);
    });
    list.addEventListener("dragend", () => {
      dragged?.classList.remove("dragging");
      dragged = null;
      for (const item of list.children) item.classList.remove("drop-target");
    });
  }

  function completedCount() {
    return sections.filter(sectionAnswered).length;
  }

  function updateProgress() {
    const complete = completedCount();
    progress.max = sections.length;
    progress.value = complete;
    progressCopy.textContent = `${complete} of ${sections.length} complete`;
    for (const section of sections) {
      const tally = section.querySelector("[data-review-tally]");
      const next = section.querySelector("[data-review-next]");
      if (tally) tally.textContent = `${complete} of ${sections.length} complete`;
      if (next) next.disabled = !sectionAnswered(section) || activeIndex === sections.length - 1;
    }
  }

  function showPose(index, {scroll = true} = {}) {
    activeIndex = Math.max(0, Math.min(sections.length - 1, Number(index) || 0));
    sections.forEach((section, position) => {
      section.hidden = position !== activeIndex;
      const previous = section.querySelector("[data-review-previous]");
      if (previous) previous.disabled = activeIndex === 0;
      const next = section.querySelector("[data-review-next]");
      if (next) {
        next.textContent = activeIndex === sections.length - 1 ? "All choices saved" : "Next";
      }
    });
    cursor.value = String(activeIndex);
    updateProgress();
    if (scroll) sections[activeIndex].scrollIntoView({behavior: "smooth", block: "start"});
  }

  for (const section of sections) {
    section.querySelector("[data-review-previous]").addEventListener("click", () => {
      showPose(activeIndex - 1);
    });
    section.querySelector("[data-review-next]").addEventListener("click", () => {
      if (sectionAnswered(section)) showPose(activeIndex + 1);
    });
  }
  document.addEventListener("input", updateProgress);
  document.addEventListener("change", updateProgress);

  function syncFromInputs() {
    for (const section of sections.filter((candidate) => candidate.dataset.reviewMode === "ranking")) {
      const input = section.querySelector("[data-ranking-input]");
      const ids = String(input.value || "").split("|").filter(Boolean);
      const list = section.querySelector("[data-ranking-list]");
      const items = new Map(
        Array.from(list.querySelectorAll("[data-ranking-candidate]")).map((item) => [
          item.dataset.rankingCandidate,
          item,
        ]),
      );
      if (ids.length === 3 && ids.every((id) => items.has(id))) {
        ids.forEach((id) => list.append(items.get(id)));
        section.querySelector("[data-ranking-status]").textContent = "Ranking restored.";
        section.querySelector("[data-ranking-confirm]").textContent = "Ranking saved";
      }
      updateRankDisplay(list);
    }
    showPose(Number(cursor.value || 0), {scroll: false});
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent || event.data?.source !== "arachne-chrome") return;
    if (event.data.type === "restore") setTimeout(syncFromInputs, 0);
    if (event.data.type === "scroll-to") {
      const index = sections.findIndex((section) => section.dataset.decision === event.data.axis);
      if (index >= 0) showPose(index);
    }
  });

  window.arachneCaptureHooks = Object.freeze({
    isAnswered(element) {
      return sectionAnswered(element);
    },
    composeMarkdown(form) {
      const lines = [`# ${review.title}`, ""];
      for (const pose of review.poses) {
        lines.push(`## ${pose.label}`);
        const decision = pose.decision;
        if (decision.mode === "pair") {
          const chosen = String(form[decision.field] || "");
          if (chosen === decision.tie_value) {
            lines.push("- Choice: Tie");
          } else {
            const side = chosen === decision.left ? "A" : chosen === decision.right ? "B" : "unanswered";
            lines.push(`- Choice: ${side}${chosen ? ` (${chosen})` : ""}`);
          }
        } else {
          const ranked = String(form[decision.field] || "").split("|").filter(Boolean);
          lines.push(ranked.length ? `- Ranking: ${ranked.join(" > ")}` : "- Ranking: unanswered");
        }
        const comment = String(form[pose.comment_field] || "").trim();
        if (comment) {
          lines.push("", "Comment:", ...comment.split(/\r?\n/).map((line) => `> ${line}`));
        }
        lines.push("");
      }
      return lines.join("\n").trim();
    },
  });

  showPose(0, {scroll: false});
})();
</script>
<script data-arachne-brief-agent>
@@ARACHNE_BRIEF_AGENT@@
</script>
</body>
</html>
